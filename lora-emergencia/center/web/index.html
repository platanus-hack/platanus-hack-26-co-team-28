<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Centro LoRa</title>
  <link rel="stylesheet" href="/vendor/leaflet-1.9.4.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#content">Saltar al contenido</a>
  <div class="app-shell sidebar-collapsed" id="app-shell">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-label">Centro LoRa</span><button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Expandir navegación" aria-expanded="false">›</button></div>
      <nav id="nav">
        <a href="#overview" data-route="overview" title="Overview"><span class="nav-icon" aria-hidden="true">◉</span><span class="nav-label">Overview</span></a>
        <a href="#requests" data-route="requests" title="Solicitudes"><span class="nav-icon" aria-hidden="true">!</span><span class="nav-label">Solicitudes</span></a>
        <a href="#resources" data-route="resources" title="Recursos"><span class="nav-icon" aria-hidden="true">R</span><span class="nav-label">Recursos</span></a>
        <a href="#network" data-route="network" title="Red LoRa"><span class="nav-icon" aria-hidden="true">≋</span><span class="nav-label">Red LoRa</span></a>
        <a href="#broadcasts" data-route="broadcasts" title="Broadcasts"><span class="nav-icon" aria-hidden="true">↗</span><span class="nav-label">Broadcasts</span></a>
        <a href="#safe-people" data-route="safe-people" title="Personas a salvo"><span class="nav-icon" aria-hidden="true">✓</span><span class="nav-label">Personas a salvo</span></a>
        <a href="#simulator" data-route="simulator" id="simulator-nav" title="Simulador" hidden><span class="nav-icon" aria-hidden="true">◇</span><span class="nav-label">Simulador</span></a>
      </nav>
      <div class="sidebar-footer">
        <span id="connection-dot" class="status-dot"></span>
        <span id="connection-text" class="connection-label">Conectando…</span>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operación offline</p>
          <h1 id="page-title">Overview</h1>
        </div>
        <div class="topbar-status">
          <button id="sync-button" class="button sync-button" type="button">↻ Sincronizar</button>
          <span id="last-sync" class="last-sync" title="Última sincronización local">Sin sincronizar</span>
          <button id="api-token-button" class="button" type="button">Token API</button>
          <span id="live-badge" class="badge">Actualizando</span>
          <time id="clock"></time>
        </div>
      </header>
      <main id="content" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <aside id="drawer" class="drawer" aria-label="Detalle de solicitud" aria-hidden="true">
    <div class="drawer-head"><h2>Detalle</h2><button class="icon-button" id="close-drawer" aria-label="Cerrar detalle">×</button></div>
    <div id="drawer-content"></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/vendor/leaflet-1.9.4.js" defer></script>
  <script src="/vendor/leaflet-vectorgrid-1.3.0.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
