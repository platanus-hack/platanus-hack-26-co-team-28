<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Operador de grúa · GRUA07</title>
  <style>
  /* Mismo sistema de diseño que el portal del rescatista: dark, tokens de
     seguridad, toques >=44px (WCAG 2.5.5), contraste alto. El operador ve el
     PROTOCOLO (ACC/ST); el ciudadano ve texto simple. */
  :root{
    --bg:#0C0C0D; --surface:#161719; --surface2:#212327; --border:#2E3033;
    --text:#F1F3F4; --muted:#9AA0A6;
    --danger:#FF4438; --warn:#FF8A00; --caution:#FFC400; --safe:#2FBF71; --notice:#4C9AFF;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;
    padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    display:flex;flex-direction:column}
  .hd{background:var(--notice);color:#04162e;padding:14px 16px;border-radius:14px;display:flex;align-items:center;gap:12px}
  .hd .ic{width:34px;height:34px;flex:none}
  .hd h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
  .hd .sub{font-size:12.5px;font-weight:600;opacity:.85;margin-top:1px;display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:#04162e;opacity:.5;display:inline-block}
  .dot.ok{background:#065f36;opacity:1}
  .btn{border:none;width:100%;min-height:56px;padding:15px;border-radius:14px;cursor:pointer;font-weight:700;font-size:16px;color:#fff;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{transform:scale(.98)}
  .btn.sending{opacity:.72}
  .btn:disabled{cursor:default}
  /* Toast de confirmacion tras una accion exitosa. Tokens dark del sistema. */
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);
    background:var(--surface2);color:var(--text);border:1.5px solid var(--border);border-radius:12px;
    padding:12px 18px;font-size:14.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:50;
    max-width:calc(100% - 32px);text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .btn.conn{background:var(--safe);color:#05130b;min-height:60px;font-size:18px;margin-top:16px}
  .btn.salir{background:var(--surface);color:var(--muted);border:1.5px solid var(--border);min-height:52px;font-size:15px;margin-top:16px}
  .btn.accept{background:var(--safe);color:#05130b}
  .btn.route{background:var(--notice);color:#04162e}
  .btn.place{background:var(--surface2);color:var(--text);border:1.5px solid var(--border)}
  .btn.resolve{background:var(--warn);color:#180d00}
  .error{color:var(--danger);text-align:center;font-size:14px;margin-top:12px;min-height:0}
  .error:empty{display:none}
  .list{margin-top:14px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:16px}
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .cat{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .pill{font-size:12px;font-weight:800;padding:4px 11px;border-radius:20px;background:var(--surface2);color:var(--muted);white-space:nowrap}
  .pill.p0{background:color-mix(in srgb,var(--danger) 20%,var(--surface));color:var(--danger)}
  .pill.p1{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--warn)}
  .loc{display:flex;align-items:flex-start;gap:8px;font-size:14.5px;margin:12px 0 4px}
  .loc svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--notice)}
  .loc a.maplink{color:var(--notice);font-weight:700}
  .meta{font-size:13.5px;color:var(--text);margin:6px 0 2px}
  .meta .muted{color:var(--muted)}
  .state{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.04em;padding:4px 11px;border-radius:20px;background:var(--surface2);color:var(--muted);margin:8px 0 2px;font-family:ui-monospace,Menlo,monospace}
  .empty{color:var(--muted);text-align:center;padding:34px 10px;background:var(--surface);border:1.5px dashed var(--border);border-radius:16px;margin-top:14px}
  .spacer{flex:1}
  .foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:18px}
  </style>
</head>
<body>
  <div class="app">
    <div class="hd">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 17h13v-4l4 1v3h1M5 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM16 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM3 13V8h7l3 3"/></svg>
      <div><h1>Operador de grúa · GRUA07</h1><div class="sub"><span class="dot" id="status-dot"></span><span id="status">Fuera de servicio</span></div></div>
    </div>
    <button class="btn conn" id="connect" type="button">Entrar en servicio</button>
    <div id="error" class="error"></div>
    <div id="list" class="list"></div>
    <div class="spacer"></div>
    <div class="foot">Recibes asignaciones del puesto de mando por radio LoRa.</div>
  </div>
  <script src="/grua.js"></script>
</body>
</html>
